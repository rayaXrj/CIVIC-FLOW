services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicflow
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD on the server}
    volumes:
      - civicflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow -d civicflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ${IMAGE_NAME:-ghcr.io/example/civicflow-india}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://civicflow:${POSTGRES_PASSWORD}@db:5432/civicflow
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET on the server}
      ADMIN_NAME: ${ADMIN_NAME:-City Operations Head}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL on the server}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD on the server}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
      DEMO_MODE: "false"
    ports:
      - "3000:3000"
    volumes:
      - civicflow_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  civicflow_db:
  civicflow_uploads:
